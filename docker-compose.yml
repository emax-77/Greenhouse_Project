version: '3.9'
services:
  greenhouse-api:
    build:
      context: ./GreenhouseMonitorApi
      dockerfile: Dockerfile
    ports:
      - '5000:5000'
    volumes:
      - greenhouse-data:/app/greenhouse.db
    environment:
      - ASPNETCORE_URLS=http://+:5000
      - ASPNETCORE_ENVIRONMENT=Production
volumes:
  greenhouse-data:
